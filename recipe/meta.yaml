{% set name = "nexpy" %}
{% set version = "2.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 33b22670a07f4b3508d4d681e1362ad479f90c937bb36d914f1cc58d3052c599

build:
  number: 0
  entry_points:
    - nexpy = nexpy.nexpygui:main
  noarch: python
  script: '{{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv '

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=64
    - setuptools_scm >=8
  run:
    - ansi2html
    - fabio
    - h5py
    - ipython
    - lmfit
    - matplotlib-base
    - mplcursors
    - nexusformat >=2.0.1
    - numpy
    - packaging
    - pillow
    - pylatexenc
    - python >={{ python_min }}
    - qtconsole
    - qtpy
    - scipy

test:
  requires:
    - python {{ python_min }}
  imports:
    - nexpy
    - nexpy.gui
    - nexpy.models
    - nexpy.readers
  commands:
    - nexpy --help

about:
  home: http://nexpy.github.io/nexpy/
  license: BSD-3-Clause
  license_family: BSD
  license_file: COPYING
  summary: 'NeXpy: A Python GUI to analyze NeXus data'
  doc_url: https://nexpy.github.io/nexpy/
  dev_url: https://github.com/nexpy/nexpy

extra:
  recipe-maintainers:
    - rayosborn
